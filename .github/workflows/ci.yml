name: Tamper-Evident Verification Runner

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependency
        run: python3 -m pip install pytest

      - name: Execute integrity test
        run: python3 -m pytest -q test_ledger.py
